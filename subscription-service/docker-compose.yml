services:
  subscription-service:
    build:
      context: .
      additional_contexts:
        common-lib: ../common-lib
      dockerfile: ../Dockerfile.microservice
    environment:
      APP_PORT: 3000
      DB_HOST: subscription-mongodb
      DB_PORT: 27017
      DB_USER: ${SRV_SUB_MONGO_USERNAME?}
      DB_PASS: ${SRV_SUB_MONGO_PASSWORD?}
      DB_NAME: ${SRV_SUB_MONGO_DATABASE?}
      CONTENT_GRPC_ADDRESS: ${SRV_SUB_CONTENT_GRPC_ADDRESS?}
      LOG_DIR: ${LOG_DIR?}
      LOG_ROTATE_MAX_SIZE_MB: ${LOG_ROTATE_MAX_SIZE_MB?}
      LOG_ROTATE_MAX_BACKUPS: ${LOG_ROTATE_MAX_BACKUPS?}
      LOG_ROTATE_MAX_AGE_DAYS: ${LOG_ROTATE_MAX_AGE_DAYS?}
      LOG_ROTATE_COMPRESS: ${LOG_ROTATE_COMPRESS?}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    labels:
      traefik.enable: true
      traefik.docker.network: spotlite-api-gateway
      traefik.http.routers.subscription-service.rule: PathPrefix(`/api/subscriptions`)
      traefik.http.services.subscription-service.loadbalancer.server.scheme: https
      traefik.http.routers.subscription-service.middlewares: subscription-service-strip-prefix,rate-limit-global@file
      traefik.http.middlewares.subscription-service-strip-prefix.stripprefix.prefixes: /api/subscriptions
      traefik.http.middlewares.subscription-service-strip-prefix.stripprefix.forceslash: false
      traefik.http.services.subscription-service.loadbalancer.server.port: "3000"
      traefik.http.services.subscription-service.loadbalancer.healthcheck.path: /healthz
      traefik.http.services.subscription-service.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.subscription-service.loadbalancer.healthcheck.timeout: 2s
      traefik.http.routers.subscription-service.entrypoints: websecure
      traefik.http.routers.subscription-service.tls: true
    depends_on:
      subscription-mongodb:
        condition: service_healthy
    networks:
      - api-gateway
      - subscription-internal

  subscription-mongodb:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SRV_SUB_MONGO_ROOT_USERNAME?}
      MONGO_INITDB_ROOT_PASSWORD: ${SRV_SUB_MONGO_ROOT_PASSWORD?}
      MONGO_INITDB_DATABASE: ${SRV_SUB_MONGO_DATABASE?}
      SRV_SUB_MONGO_USERNAME: ${SRV_SUB_MONGO_USERNAME?}
      SRV_SUB_MONGO_PASSWORD: ${SRV_SUB_MONGO_PASSWORD?}
    healthcheck:
      # healthcheck uses username and password value from subscription-mongodb environment variables defined above
      test:
        [
          "CMD-SHELL",
          "mongosh --norc --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 })'",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - subscription-mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - subscription-internal

networks:
  api-gateway:
    name: spotlite-api-gateway
  subscription-internal:

volumes:
  subscription-mongo-data:
