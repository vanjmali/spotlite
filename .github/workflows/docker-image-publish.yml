name: Publish Images to GHCR

on:
  push:
    # TODO: Change to main branch before merging
    # branches: [develop]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-go-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            context: ./user-service
            dockerfile: ./Dockerfile.microservice
          - service: content-service
            context: ./content-service
            dockerfile: ./content-service/Dockerfile
          - service: notification-service
            context: ./notification-service
            dockerfile: ./Dockerfile.microservice
          - service: subscription-service
            context: ./subscription-service
            dockerfile: ./Dockerfile.microservice
          - service: rating-service
            context: ./rating-service
            dockerfile: ./Dockerfile.microservice
          - service: recommendation-service
            context: ./recommendation-service
            dockerfile: ./Dockerfile.microservice
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/vanjmali/spotlite:${{ matrix.service }}
          build-contexts: |
            common-lib=./common-lib
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/vanjmali/spotlite:frontend
          build-args: |
            API_BASE_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
