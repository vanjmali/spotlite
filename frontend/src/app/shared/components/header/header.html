<header class="header">
  <!-- Title section (left) -->
  <div class="header__title">
    <button class="header__logo-button" (click)="navigateToHome()" type="button">
      <img src="/assets/images/spotlite-white.png" alt="Logo" class="header__logo" />
      <span class="header__brand">Spotlite</span>
    </button>
    <ng-content select="[title]"></ng-content>
  </div>

  <!-- Center section -->
  <div class="header__center">
    <div class="header__search" (keydown.enter)="submitSearch()">
      <mat-icon class="header__search-icon">search</mat-icon>
      <input
        type="text"
        [formControl]="searchControl"
        placeholder="Search songs, artists, albums, genres"
        (focus)="onSearchFocus()"
        (blur)="onSearchBlur()"
      />

      @if (suggestionsOpenSg()) {
        <div class="header__search-dropdown">
          @if (isSearchingSg()) {
            <p class="header__search-empty">Searching...</p>
          } @else if (suggestionsSg().length === 0) {
            <p class="header__search-empty">No results</p>
          } @else {
            @for (suggestion of suggestionsSg(); track suggestion.type + ':' + suggestion.id) {
              <button type="button" class="header__search-item" (mousedown)="openSuggestion(suggestion)">
                <span class="header__search-item-title">{{ suggestion.label }}</span>
                <span class="header__search-item-subtitle"
                  >{{ labelForType(suggestion.type) }} · {{ suggestion.subtitle }}</span
                >
              </button>
            }
          }
        </div>
      }
    </div>
  </div>

  <!-- Actions section (right) -->
  <div class="header__actions">
    @if (authService.isAuthenticatedSg()) {
      <app-user-profile-dropdown />
    } @else {
      <a routerLink="/register" class="link-primary">Register</a>
      <a routerLink="/login" class="btn-light">Login</a>
    }
  </div>
</header>
