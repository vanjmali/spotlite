<div class="user-profile">
  <button
    class="user-profile__nav-button"
    [class.user-profile__nav-button--active]="isInboxActive()"
    (click)="navigateToInbox()"
    type="button"
    aria-label="Inbox"
    title="Inbox"
  >
    <mat-icon aria-hidden="true">notifications</mat-icon>
  </button>

  @if (authService.isAdminSg()) {
    <button
      class="user-profile__nav-button"
      [class.user-profile__nav-button--active]="isAdminActive()"
      (click)="navigateToAdmin()"
      type="button"
      aria-label="Admin"
      title="Admin"
    >
      <mat-icon aria-hidden="true">settings</mat-icon>
    </button>
  }

  <button
    class="user-profile__avatar"
    [class.user-profile__avatar--active]="isProfileActive()"
    (click)="navigateToProfile()"
    [attr.aria-label]="'Profile settings for ' + (authService.currentEmailSg() || 'user')"
    type="button"
  >
    <app-cover-art [name]="profileCoverName()" [size]="34" [fontSize]="12" [pattern]="false" />
  </button>
</div>
