<div class="page" [class.page--resizing]="isResizingSg()">
  <app-header />

  <div class="page__main">
    @if (showSidebarsSg() && authService.isAuthenticatedSg()) {
      <aside class="page__aside" [style.width.px]="leftSidebarWidthSg()">
        <app-homepage-left-sidebar />
      </aside>
      <div
        class="page__resizer page__resizer--left"
        (mousedown)="startResize('left', $event)"
        (dblclick)="resetSidebarWidth('left')"
        title="Drag to resize. Double-click to reset."
      ></div>
    }
    @if (!showSidebarsSg()) {
      <aside class="page__custom-aside">
        <ng-content select="[aside]"></ng-content>
      </aside>
    }

    <main class="page__content">
      <ng-content select="[content]"></ng-content>
    </main>

    @if (showSidebarsSg() && authService.isAuthenticatedSg()) {
      <div
        class="page__resizer page__resizer--right"
        (mousedown)="startResize('right', $event)"
        (dblclick)="resetSidebarWidth('right')"
        title="Drag to resize. Double-click to reset."
      ></div>
      <aside class="page__right" [style.width.px]="rightSidebarWidthSg()">
        <app-homepage-right-sidebar />
      </aside>
    }
  </div>

  @if (authService.isAuthenticatedSg() && !showSidebarsSg()) {
    <div class="page__player">
      <app-playback-bar />
    </div>
  }

  <footer class="page__footer">
    @if (showControlBarSg() && authService.isAuthenticatedSg()) {
      <app-control-bar [homepageMode]="true" />
    } @else {
      <app-site-footer />
    }
  </footer>
</div>
