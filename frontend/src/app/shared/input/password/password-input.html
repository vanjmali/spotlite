<div class="password-input">
  <div class="password-input__form-group">
    <label class="password-input__label" for="password">
      {{ labelSg() }}
    </label>
    <div class="password-input__input-wrapper">
      <input
        class="password-input__input"
        [class.password-input__input--error]="errorSg()"
        id="password"
        [type]="getInputType()"
        [value]="valueSg()"
        (input)="onValueChange($any($event.target).value)"
      />
      <button
        type="button"
        class="password-input__toggle-btn"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="showPasswordSg() ? 'Hide password' : 'Show password'"
      >
        @if (showPasswordSg()) {
          <mat-icon class="password-input__icon">visibility_off</mat-icon>
        } @else {
          <mat-icon class="password-input__icon">visibility</mat-icon>
        }
      </button>
    </div>
  </div>
  <app-error [message]="errorSg()" />
</div>
