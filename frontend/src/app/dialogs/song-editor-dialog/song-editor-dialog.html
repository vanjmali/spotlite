@if (isOpen()) {
  <app-dialog [title]="dialogTitle()" (closed)="cancel()">
    <div content class="song-editor-dialog" #dialogContent>
      @if (errorSg()) {
        <app-message type="error" [message]="errorSg()" />
      }
      <app-text-input
        label="Title"
        placeholder="Enter song title"
        [required]="true"
        [(value)]="titleSg"
      />

      @if (isCreateMode()) {
        <app-select-input
          label="Album"
          placeholder="Select album"
          [required]="true"
          [options]="albumOptionsSg()"
          [single]="true"
          [(value)]="albumIdSg"
        />
      }

      <app-select-input
        label="Genres"
        placeholder="Select genres"
        [required]="true"
        [options]="genreOptionsSg()"
        [(value)]="genreIdsSg"
      />

      <div class="song-editor-dialog__file-field">
        <label class="song-editor-dialog__label" [for]="audioInputId">
          {{ isCreateMode() ? 'Audio File' : 'Replace Audio (optional)' }}
        </label>
        <div class="song-editor-dialog__file-picker">
          <label class="btn-secondary song-editor-dialog__file-btn" [for]="audioInputId">
            <span>Choose File</span>
            <span class="song-editor-dialog__file-btn-name">
              {{ selectedAudioFileName() || 'No file chosen' }}
            </span>
          </label>
        </div>
        <input
          class="song-editor-dialog__file-input"
          [id]="audioInputId"
          type="file"
          accept="audio/*"
          [required]="isCreateMode()"
          (change)="onAudioFileChange($event)"
        />
      </div>

      <app-select-input
        label="Artists"
        placeholder="Select artists"
        [required]="true"
        [options]="artistOptionsSg()"
        [(value)]="selectedArtistIdsSg"
      />
    </div>

    <div footer class="song-editor-dialog__footer">
      <button class="btn-secondary" type="button" (click)="cancel()" [disabled]="isLoadingSg()">
        Cancel
      </button>
      <button
        class="btn-primary"
        type="button"
        (click)="submit()"
        [disabled]="!isFormValid() || isLoadingSg()"
      >
        @if (isLoadingSg()) {
          <span class="btn-spinner" aria-hidden="true"></span>
        }
        {{ submitButtonText() }}
      </button>
    </div>
  </app-dialog>
}
