@if (!embeddedSg()) {
  <app-dialog title="Change Password" (closed)="cancel()">
    <form
      content
      class="change-password-dialog"
      id="change-password-form"
      (submit)="$event.preventDefault(); submit()"
    >
      <app-password-input
        #currentPasswordInput
        label="Current Password"
        [required]="true"
        [value]="currentPasswordSg()"
        (valueChange)="currentPasswordSg.set($event)"
      ></app-password-input>

      <app-password-input
        #newPasswordInput
        label="New Password"
        [required]="true"
        [min]="10"
        [max]="20"
        [showCriteria]="true"
        [value]="newPasswordSg()"
        (valueChange)="newPasswordSg.set($event)"
      ></app-password-input>

      <app-password-input
        #confirmPasswordInput
        label="Confirm Password"
        [required]="true"
        [value]="confirmPasswordSg()"
        (valueChange)="confirmPasswordSg.set($event)"
      ></app-password-input>

      @if (errorSg()) {
        <app-message [message]="errorSg()" type="error" />
      }
    </form>

    <div footer class="change-password-dialog__footer">
      <button class="btn-secondary" (click)="cancel()" [disabled]="loadingSg()" type="button">
        Cancel
      </button>
      <button
        class="btn-primary"
        form="change-password-form"
        type="submit"
        [disabled]="loadingSg()"
      >
        Change Password
      </button>
    </div>
  </app-dialog>
} @else {
  <div class="change-password-dialog">
    <app-password-input
      #currentPasswordInput
      label="Current Password"
      [required]="true"
      [value]="currentPasswordSg()"
      (valueChange)="currentPasswordSg.set($event)"
    ></app-password-input>

    <app-password-input
      #newPasswordInput
      label="New Password"
      [required]="true"
      [min]="10"
      [max]="20"
      [showCriteria]="true"
      [value]="newPasswordSg()"
      (valueChange)="newPasswordSg.set($event)"
    ></app-password-input>

    <app-password-input
      #confirmPasswordInput
      label="Confirm Password"
      [required]="true"
      [value]="confirmPasswordSg()"
      (valueChange)="confirmPasswordSg.set($event)"
    ></app-password-input>

    @if (errorSg()) {
      <app-message [message]="errorSg()" type="error" />
    }

    @if (successSg()) {
      <app-message [message]="successSg()" type="success" />
    }

    <div class="change-password-dialog__footer">
      <button
        class="btn-primary"
        (click)="submit()"
        [disabled]="!isValidSg() || loadingSg()"
        type="button"
      >
        @if (loadingSg()) {
          <span class="btn-spinner" aria-hidden="true"></span>
        }
        Change Password
      </button>
    </div>
  </div>
}
