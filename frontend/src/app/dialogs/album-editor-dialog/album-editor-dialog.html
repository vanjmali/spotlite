@if (isOpen()) {
  <app-dialog [title]="dialogTitle()" (closed)="cancel()">
    <div content class="album-editor-dialog" #dialogContent>
      @if (errorSg()) {
        <app-message type="error" [message]="errorSg()" />
      }
      <app-text-input
        label="Title"
        placeholder="Enter album title"
        [required]="true"
        [(value)]="titleSg"
      />

      <app-date-input label="Release Date" [required]="true" [(value)]="releaseDateSg" />

      <app-select-input
        label="Genres"
        placeholder="Select genres"
        [required]="true"
        [options]="genreOptionsSg()"
        [(value)]="genreIdsSg"
      />

      <app-select-input
        label="Artists"
        placeholder="Select artists"
        [required]="true"
        [options]="artistOptionsSg()"
        [(value)]="selectedArtistIdsSg"
      />

      <!-- Songs are managed after creation via the manage songs dialog -->
    </div>

    <div footer class="album-editor-dialog__footer">
      <button class="btn-secondary" type="button" (click)="cancel()" [disabled]="isLoadingSg()">
        Cancel
      </button>
      <button
        class="btn-primary"
        type="button"
        (click)="submit()"
        [disabled]="!isFormValid() || isLoadingSg()"
      >
        @if (isLoadingSg()) {
          <span class="btn-spinner" aria-hidden="true"></span>
        }
        {{ submitButtonText() }}
      </button>
    </div>
  </app-dialog>
}
