@if (isOpen()) {
  <app-dialog [title]="dialogTitle()" (closed)="cancel()">
    <div content class="artist-editor-dialog">
      <!-- Name Input -->
      <app-text-input
        label="Artist Name"
        [required]="true"
        [min]="2"
        [(value)]="nameSg"
        placeholder="e.g., The Weeknd"
      ></app-text-input>

      <!-- Description Input -->
      <app-textarea-input
        label="Description"
        [required]="true"
        [min]="2"
        [rows]="3"
        [(value)]="descriptionSg"
        placeholder="Enter artist description"
      ></app-textarea-input>

      <!-- Genres Section -->
      <app-select-input
        label="Genres"
        placeholder="Select genres"
        [required]="true"
        [options]="genreOptionsSg()"
        [(value)]="genreIdsSg"
      />

      @if (errorSg()) {
        <app-message [message]="errorSg()" type="error" />
      }
    </div>

    <div footer class="artist-editor-dialog__footer">
      <button class="btn-secondary" type="button" (click)="cancel()" [disabled]="isLoadingSg()">
        Cancel
      </button>
      <button
        class="btn-primary"
        type="button"
        (click)="submit()"
        [disabled]="!isFormValid() || isLoadingSg()"
      >
        {{ submitButtonText() }}
      </button>
    </div>
  </app-dialog>
}
