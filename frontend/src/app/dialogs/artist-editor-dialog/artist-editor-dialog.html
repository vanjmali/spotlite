@if (isOpen()) {
  <app-dialog [title]="dialogTitle()" (closed)="cancel()">
    <div content class="artist-editor-dialog">
      <!-- Name Input -->
      <app-text-input
        label="Artist Name"
        [required]="true"
        [min]="2"
        [(value)]="nameSg"
        placeholder="e.g., The Weeknd"
      ></app-text-input>

      <!-- Description Input -->
      <app-textarea-input
        label="Description"
        [required]="true"
        [min]="2"
        [rows]="3"
        [(value)]="descriptionSg"
        placeholder="Enter artist description"
      ></app-textarea-input>

      <!-- Genres Section -->
      <div class="artist-editor-dialog__genres">
        <label class="artist-editor-dialog__label">Genres</label>
        <div class="artist-editor-dialog__genre-input">
          <input
            #genreInput
            type="text"
            class="artist-editor-dialog__genre-field"
            [value]="currentGenreSg()"
            (input)="currentGenreSg.set(genreInput.value)"
            placeholder="e.g., Pop"
            (keyup.enter)="onAddGenre()"
          />
          <button
            type="button"
            class="artist-editor-dialog__btn-add-genre"
            (click)="onAddGenre()"
            [disabled]="!currentGenreSg().trim()"
          >
            <mat-icon>add</mat-icon>
          </button>
        </div>

        <!-- Genre Tags -->
        @if (genresSg().length > 0) {
          <div class="artist-editor-dialog__genre-tags">
            @for (genre of genresSg(); track genre; let i = $index) {
              <div class="artist-editor-dialog__genre-tag">
                <span>{{ genre }}</span>
                <button
                  type="button"
                  class="artist-editor-dialog__genre-remove"
                  (click)="onRemoveGenre(i)"
                  title="Remove genre"
                >
                  <mat-icon>close</mat-icon>
                </button>
              </div>
            }
          </div>
        }
      </div>

      @if (errorSg()) {
        <app-message [message]="errorSg()" type="error" />
      }
    </div>

    <div footer class="artist-editor-dialog__footer">
      <button class="btn-secondary" type="button" (click)="cancel()" [disabled]="isLoadingSg()">
        Cancel
      </button>
      <button
        class="btn-primary"
        type="button"
        (click)="submit()"
        [disabled]="!isFormValid() || isLoadingSg()"
      >
        {{ submitButtonText() }}
      </button>
    </div>
  </app-dialog>
}
