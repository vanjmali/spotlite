<app-page>
  <div content class="profile-page">
    <!-- Profile Section -->
    <div class="profile-page__section">
      <h2 class="profile-page__section-title">Profile</h2>
      <div class="profile-page__section-content">
        <button class="profile-page__section-item" (click)="navigateToEditProfile()">
          <mat-icon class="profile-page__section-icon">edit</mat-icon>
          <span class="profile-page__section-label">Edit personal info</span>
          <mat-icon class="profile-page__section-arrow">chevron_right</mat-icon>
        </button>
      </div>
    </div>

    <!-- Security and Privacy Section -->
    <div class="profile-page__section">
      <h2 class="profile-page__section-title">Security and privacy</h2>
      <div class="profile-page__section-content">
        <button class="profile-page__section-item" (click)="navigateToChangePassword()">
          <mat-icon class="profile-page__section-icon">lock</mat-icon>
          <span class="profile-page__section-label">Change password</span>
          <mat-icon class="profile-page__section-arrow">chevron_right</mat-icon>
        </button>
      </div>
    </div>
  </div>
</app-page>

<!-- Change Password Dialog -->
@if (isChangePasswordDialogOpenSg()) {
  <app-change-password-dialog (closed)="closeChangePasswordDialog()" />
}
