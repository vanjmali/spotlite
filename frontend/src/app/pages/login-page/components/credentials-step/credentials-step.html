<div class="credentials-step">
  <h1 class="credentials-step__title">Welcome</h1>

  <app-email-input
    label="Email address"
    [required]="true"
    [value]="emailSg()"
    (valueChange)="emailSg.set($event)"
    #emailInput
  ></app-email-input>

  <app-password-input
    label="Password"
    [required]="true"
    [value]="passwordSg()"
    (valueChange)="passwordSg.set($event)"
    #passwordInput
  ></app-password-input>

  <div class="credentials-step__actions">
    <button class="btn-primary" (click)="submit()" [disabled]="loadingSg()">Continue</button>
  </div>

  <div class="credentials-step__signup">
    <div class="credentials-step__signup-text">No account?</div>
    <a href="#" class="credentials-step__signup-link">Register</a>
  </div>
</div>
