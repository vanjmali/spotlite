<div class="password-step">
  <h2 class="password-step__title">Log in with password</h2>

  <div class="password-step__input-container">
    <app-email-input [(value)]="emailSg" [label]="'Email'" [required]="true" />
  </div>

  <div class="password-step__input-container">
    <app-password-input [(value)]="passwordSg" [label]="'Password'" [required]="true" />
  </div>

  <div class="password-step__actions">
    <button type="button" class="btn-primary" (click)="submit()" [disabled]="loadingSg()">
      {{ loadingSg() ? 'Logging in...' : 'Log in' }}
    </button>
  </div>

  <div class="password-step__otp-prompt">
    <a
      routerLink="/login/email"
      class="password-step__otp-prompt-link"
      [class.password-step__otp-prompt-link--disabled]="loadingSg()"
    >
      Log in without password
    </a>
  </div>
</div>
