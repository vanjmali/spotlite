@let error = store.errorSg();
@let success = successSg();

<form class="otp-step" (submit)="$event.preventDefault(); verify()">
  <h2 class="otp-step__title">Enter the 6-digit code we sent to {{ store.emailSg() }}</h2>

  <div class="otp-step__input-container">
    <app-otp-input [(value)]="codeSg" [required]="true" />
  </div>

  @if (error) {
    <app-message [message]="error" type="error" />
  }

  @if (success) {
    <app-message [message]="success" type="success" />
  }

  <app-registration-step-footer
    label="Login"
    loadingLabel="Logging in..."
    [loading]="loadingSg()"
    [stackActions]="true"
    [submit]="true"
    secondaryLabel="Resend Code"
    [secondaryDisabled]="loadingSg()"
    (secondaryAction)="resend()"
    (action)="verify()"
  />
</form>
