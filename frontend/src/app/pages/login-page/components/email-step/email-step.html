<div class="email-step">
  <h1 class="email-step__title">Welcome</h1>

  <app-email-input [(value)]="emailSg" [label]="'Email address'" [required]="true" />

  <div class="email-step__actions">
    <button class="btn-primary" (click)="submit()">Continue</button>
  </div>

  <div class="email-step__signup">
    <div class="email-step__signup-text">No account?</div>
    <a href="#" class="email-step__signup-link">Register</a>
  </div>
</div>
