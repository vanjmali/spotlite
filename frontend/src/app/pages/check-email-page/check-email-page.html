<div class="check-email-page">
  <div class="check-email-page__section">
    <div class="check-email-page__card">
      <div class="check-email-page__icon-wrapper">
        <mat-icon class="check-email-page__mail-icon">mail_outline</mat-icon>
      </div>

      <h1 class="check-email-page__title">Check Your Email</h1>
      <p class="check-email-page__message">
        We've sent you a confirmation link to complete your registration. Please check your email
        and click the link to activate your account.
      </p>

      <p class="check-email-page__hint">Didn't receive the email? Check your spam folder.</p>

      <div class="check-email-page__button-wrapper">
        <a routerLink="/login" class="btn-primary">Go to Login</a>
      </div>
    </div>
  </div>
</div>
