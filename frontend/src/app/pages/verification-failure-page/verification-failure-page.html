<div class="verification-failure-page">
  <div class="verification-failure-page__section">
    <div class="verification-failure-page__card">
      <div class="verification-failure-page__icon-wrapper">
        <mat-icon class="verification-failure-page__error-icon">cancel</mat-icon>
      </div>

      <h1 class="verification-failure-page__title">Verification Failed</h1>
      <p class="verification-failure-page__message">
        The verification link may have expired or is invalid.
      </p>

      <div class="verification-failure-page__button-wrapper">
        <a routerLink="/register" class="btn-primary">Register Again</a>
      </div>
      <a routerLink="/login" class="link-primary">Go to Login</a>
    </div>
  </div>
</div>
