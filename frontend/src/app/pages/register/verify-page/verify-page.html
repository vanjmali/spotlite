<app-auth-layout [title]="title" [showStepCount]="false">
  <div auth-body class="verify-page__body">
    @if (statusSg() === 'loading') {
      <app-loader title="Verifying your email" message="Please wait a moment." />
    } @else if (statusSg() === 'success') {
      <div class="verify-page__card">
        <div class="verify-page__icon verify-page__icon--success">
          <mat-icon aria-hidden="true">check_circle</mat-icon>
        </div>
        <h3 class="verify-page__title">Email verified</h3>
        <p class="verify-page__text">Your account is now active. You can sign in below.</p>
      </div>
    } @else {
      <div class="verify-page__card">
        <div class="verify-page__icon verify-page__icon--error">
          <mat-icon aria-hidden="true">cancel</mat-icon>
        </div>
        <h3 class="verify-page__title">Verification failed</h3>
        <p class="verify-page__text">{{ errorSg() }}</p>
      </div>
    }
  </div>

  @if (statusSg() === 'success') {
    <app-auth-form-footer auth-footer label="Go to login" (action)="goToLogin()" />
  } @else if (statusSg() === 'error') {
    <app-auth-form-footer auth-footer label="Back to register" (action)="goToRegister()" />
  }
</app-auth-layout>
