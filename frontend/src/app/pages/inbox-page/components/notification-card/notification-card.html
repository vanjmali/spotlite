<div class="inbox-item" [class.is-new]="notification.is_new">
  <div class="item-content">
    <div class="item-title">Notification</div>
    <div class="item-meta">
      <span class="timestamp">{{ timeAgo }}</span>
    </div>
    <div class="item-message">{{ notification.message }}</div>
  </div>
</div>
