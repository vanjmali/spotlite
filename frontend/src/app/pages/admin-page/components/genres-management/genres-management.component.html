<app-item-table
  title="Manage Genres"
  [isLoading]="isLoadingSg()"
  [isEmpty]="!isLoadingSg() && genresSg().length === 0"
  emptyMessage="No genres found. Create one to get started!"
  [showPagination]="!isLoadingSg() && totalSg() > 0"
>
  <button
    actions
    class="genres-management__btn-add-circle"
    (click)="onAddNew()"
    [disabled]="isLoadingSg()"
    title="Add new genre"
    matTooltip="Add new genre"
  >
    <mat-icon>add</mat-icon>
  </button>

  <div table class="item-table__table-wrapper">
    <table class="item-table__table genres-management__table">
      <thead class="item-table__table-head">
        <tr>
          <th class="genres-management__col-name">Name</th>
          <th class="genres-management__col-actions">Actions</th>
        </tr>
      </thead>
      <tbody class="item-table__table-body">
        @for (genre of genresSg(); track genre.id) {
          <tr class="item-table__row" (click)="onEdit(genre)">
            <td class="item-table__cell item-table__cell--title">
              <button
                class="item-table__title-link"
                type="button"
                (click)="$event.stopPropagation()"
                title="Edit genre"
                matTooltip="Edit genre"
              >
                {{ genre.name }}
              </button>
            </td>
            <td class="item-table__cell genres-management__cell--actions">
              <button
                class="item-table__btn-action item-table__btn-edit"
                (click)="$event.stopPropagation(); onEdit(genre)"
                title="Edit genre"
                matTooltip="Edit"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                class="item-table__btn-action item-table__btn-delete"
                (click)="$event.stopPropagation(); onDelete(genre)"
                title="Delete genre"
                matTooltip="Delete"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <app-pagination
    pagination
    [page]="currentPageSg()"
    [pageSize]="pageSizeSg()"
    [total]="totalSg()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />
</app-item-table>

<app-genre-editor-dialog
  [genre]="selectedGenreSg()"
  [isOpen]="isDialogOpenSg()"
  (closed)="isDialogOpenSg.set(false)"
  (saved)="onDialogSaved()"
></app-genre-editor-dialog>
