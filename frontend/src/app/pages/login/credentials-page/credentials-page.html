@let error = store.errorSg();

<app-auth-layout [title]="title" [showStepCount]="false">
  <form auth-body class="credentials-page" (submit)="$event.preventDefault(); submit()">
    <app-email-input
      label="Email address"
      [required]="true"
      [value]="emailSg()"
      (valueChange)="emailSg.set($event)"
      #emailInput
    ></app-email-input>

    <app-password-input
      label="Password"
      [required]="true"
      [showCriteria]="false"
      [min]="3"
      [value]="passwordSg()"
      (valueChange)="passwordSg.set($event)"
      #passwordInput
    ></app-password-input>

    <div class="credentials-page__forgot-password">
      <a routerLink="/login/reset" class="credentials-page__forgot-password-link">
        Forgot password?
      </a>
    </div>

    @if (error) {
      <app-message [message]="error" type="error" />
    }
  </form>

  <app-auth-form-footer
    auth-footer
    label="Continue"
    [loading]="loadingSg()"
    [submit]="true"
    (action)="submit()"
    hintText="No account?"
    hintLinkText="Register"
    hintLinkUrl="/register"
  />
</app-auth-layout>
