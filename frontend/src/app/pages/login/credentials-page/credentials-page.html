@let error = store.errorSg();

<app-auth-layout [title]="title" [showStepCount]="false">
  <form
    auth-body
    class="credentials-page"
    id="login-credentials-form"
    (submit)="$event.preventDefault(); submit()"
  >
    <app-email-input
      label="Email address"
      [required]="true"
      [value]="emailSg()"
      (valueChange)="emailSg.set($event)"
      #emailInput
    ></app-email-input>

    <app-password-input
      label="Password"
      [required]="true"
      [showCriteria]="false"
      [min]="3"
      [value]="passwordSg()"
      (valueChange)="passwordSg.set($event)"
      #passwordInput
    ></app-password-input>

    <div class="credentials-page__forgot-password">
      <a routerLink="/login/reset" class="credentials-page__forgot-password-link">
        Forgot password?
      </a>
    </div>

    @if (verificationNoticeSg()) {
      <div class="credentials-page__verification">
        <div class="credentials-page__verification-icon">
          <mat-icon aria-hidden="true">mark_email_read</mat-icon>
        </div>
        <div class="credentials-page__verification-content">
          <div class="credentials-page__verification-title">Check your email</div>
          <div class="credentials-page__verification-text">
            Your account needs to be verified before you can log in. Please check your email for a
            verification link.
          </div>
        </div>
      </div>
    } @else if (error) {
      <app-message [message]="error" type="error" />
    }
  </form>

  <app-form-footer
    auth-footer
    label="Continue"
    [inProgress]="loadingSg()"
    [submit]="true"
    formId="login-credentials-form"
    (action)="submit()"
    hintText="No account?"
    hintLinkText="Register"
    hintLinkUrl="/register"
  />
</app-auth-layout>
