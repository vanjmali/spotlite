@let error = store.errorSg();
@let loading = store.loadingSg();

<div class="credentials-step">
  <div class="credentials-step__content">
    <app-text-input
      label="Username"
      placeholder="Choose a username"
      [required]="true"
      [showRequiredIndicator]="false"
      [min]="4"
      [max]="20"
      [pattern]="usernamePattern"
      [patternMessage]="validationMessages.USERNAME_INVALID"
      [value]="usernameSg()"
      (valueChange)="usernameSg.set($event)"
      #usernameInput
    ></app-text-input>

    <app-password-input
      label="Password"
      [required]="true"
      [min]="10"
      [max]="20"
      [showCriteria]="true"
      [value]="passwordSg()"
      (valueChange)="passwordSg.set($event)"
      #passwordInput
    ></app-password-input>

    <app-password-input
      label="Confirm Password"
      [required]="true"
      [min]="10"
      [max]="20"
      [value]="confirmPasswordSg()"
      (valueChange)="confirmPasswordSg.set($event)"
      #confirmPasswordInput
    ></app-password-input>
  </div>

  @if (error) {
    <app-message [message]="error" type="error" />
  }

  <app-registration-step-footer
    label="Register"
    [loading]="loadingSg()"
    (action)="submit()"
    hintText="Already have account?"
    hintLinkText="Login"
    hintLinkUrl="/login"
  />
</div>
