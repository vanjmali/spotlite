<div class="registration-page">
  <img src="assets/images/spotlite-white.png" alt="Spotlite" class="registration-page__icon" />

  <div class="registration-page__section">
    <app-auth-step-header
      [showBack]="canGoBackSg()"
      [showStepCount]="true"
      [stepIndex]="stepIndexSg()"
      [totalSteps]="totalSteps"
      [title]="stepTitleSg()"
      (back)="goBack()"
    />

    <div class="registration-page__body">
      @if (step() === 'personal') {
        <div class="registration-page__step" [@stepSlide]="animationParams()">
          <app-registration-personal-info-step />
        </div>
      } @else if (step() === 'credentials') {
        <div class="registration-page__step" [@stepSlide]="animationParams()">
          <app-registration-credentials-step />
        </div>
      } @else if (step() === 'verify') {
        <div class="registration-page__step" [@stepSlide]="animationParams()">
          <app-registration-check-email-step />
        </div>
      } @else {
        <div class="registration-page__step" [@stepSlide]="animationParams()">
          <span>Unknown error occurred.</span>
        </div>
      }
    </div>
  </div>
</div>
