<div class="registration-page">
  <img src="assets/images/spotlite-white.png" alt="Spotlite" class="registration-page__icon" />

  <div class="registration-page__section">
    @if (step() === 'personal') {
      <app-registration-personal-info-step />
    } @else {
      <app-registration-credentials-step />
    }

    <div class="registration-page__login">
      <div class="registration-page__login-text">Already have account?</div>
      <a routerLink="/login" class="link-primary">Login</a>
    </div>
  </div>
</div>
