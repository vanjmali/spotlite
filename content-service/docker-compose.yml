services:
  content-service:
    build:
      context: .
      additional_contexts:
        common-lib: ../common-lib
      dockerfile: ../Dockerfile.microservice
    environment:
      DB_HOST: content-mongodb
      DB_PORT: 27017
      DB_USER: ${SRV_CONTENT_MONGO_USERNAME?}
      DB_PASS: ${SRV_CONTENT_MONGO_PASSWORD?}
      DB_NAME: ${SRV_CONTENT_MONGO_DATABASE?}
      HDFS_URI: ${SRV_CONTENT_HDFS_URI?}
      HDFS_AUDIO_BASE: ${SRV_CONTENT_HDFS_AUDIO_BASE?}
      GRPC_PORT: ${SRV_CONTENT_GRPC_PORT?}
      APP_PORT: 3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    labels:
      traefik.enable: true
      traefik.docker.network: spotlite-api-gateway
      traefik.http.routers.content-service.rule: PathPrefix(`/api/content`)
      traefik.http.routers.content-service.middlewares: content-service-strip-prefix,rate-limit-global@file
      traefik.http.middlewares.content-service-strip-prefix.stripprefix.prefixes: /api/content
      traefik.http.middlewares.content-service-strip-prefix.stripprefix.forceslash: false
      traefik.http.services.content-service.loadbalancer.server.port: "3000"
    depends_on:
      content-mongodb:
        condition: service_healthy
      hdfs-namenode:
        condition: service_healthy
    networks:
      - api-gateway
      - content-internal

  content-mongodb:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SRV_CONTENT_MONGO_ROOT_USERNAME?}
      MONGO_INITDB_ROOT_PASSWORD: ${SRV_CONTENT_MONGO_ROOT_PASSWORD?}
      MONGO_INITDB_DATABASE: ${SRV_CONTENT_MONGO_DATABASE?}
      SRV_CONTENT_MONGO_USERNAME: ${SRV_CONTENT_MONGO_USERNAME?}
      SRV_CONTENT_MONGO_PASSWORD: ${SRV_CONTENT_MONGO_PASSWORD?}
    healthcheck:
      # healthcheck uses username and password value from content-mongodb environment variables defined above
      test:
        [
          "CMD-SHELL",
          'mongosh --norc --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval ''db.runCommand({ ping: 1 })''',
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - content-mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - content-internal

  hdfs-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      - CLUSTER_NAME=spotlite
      - CORE_CONF_fs_defaultFS=hdfs://hdfs-namenode:8020
      - HDFS_CONF_dfs_permissions_enabled=false
    ports:
      - "9870:9870" # HDFS web UI
      - "8020:8020" # Namenode RPC (za Go client)
    volumes:
      - hdfs-namenode-data:/hadoop/dfs/name
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - content-internal

  hdfs-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    environment:
      - CLUSTER_NAME=spotlite
      - CORE_CONF_fs_defaultFS=hdfs://hdfs-namenode:8020
      - SERVICE_PRECONDITION=hdfs-namenode:9870
    volumes:
      - hdfs-datanode-data:/hadoop/dfs/data
    healthcheck: 
      test: ["CMD", "curl", "-f", "http://hdfs-namenode:9870"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    networks:
      - content-internal

networks:
  api-gateway:
    name: spotlite-api-gateway
  content-internal:

volumes:
  content-mongo-data:
  hdfs-namenode-data:
  hdfs-datanode-data:
