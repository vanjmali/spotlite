services:
  content-service:
    build:
      context: .
      additional_contexts:
        common-lib: ../common-lib
      dockerfile: ./Dockerfile
    environment:
      APP_PORT: 3000
      REDIS_ADDR: ${CONTENT_REDIS_ADDR}
      DB_HOST: content-mongodb
      DB_PORT: 27017
      DB_USER: ${SRV_CONTENT_MONGO_USERNAME?}
      DB_PASS: ${SRV_CONTENT_MONGO_PASSWORD?}
      DB_NAME: ${SRV_CONTENT_MONGO_DATABASE?}
      HDFS_URI: ${SRV_CONTENT_HDFS_URI?}
      HDFS_AUDIO_BASE: ${SRV_CONTENT_HDFS_AUDIO_BASE?}
      HDFS_USER: ${SRV_CONTENT_HDFS_USER?}
      HDFS_DATA_TRANSFER_PROTECTION: ${SRV_CONTENT_HDFS_DATA_TRANSFER_PROTECTION?}
      GRPC_PORT: ${SRV_CONTENT_GRPC_PORT?}
      RATING_GRPC_ADDRESS: ${SRV_RATING_GRPC_ADDRESS?}
      LOG_DIR: ${LOG_DIR?}
      LOG_ROTATE_MAX_SIZE_MB: ${LOG_ROTATE_MAX_SIZE_MB?}
      LOG_ROTATE_MAX_BACKUPS: ${LOG_ROTATE_MAX_BACKUPS?}
      LOG_ROTATE_MAX_AGE_DAYS: ${LOG_ROTATE_MAX_AGE_DAYS?}
      LOG_ROTATE_COMPRESS: ${LOG_ROTATE_COMPRESS?}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    labels:
      traefik.enable: true
      traefik.docker.network: spotlite-api-gateway
      traefik.http.routers.content-service.rule: PathPrefix(`/api/content`)
      traefik.http.services.content-service.loadbalancer.server.scheme: https
      traefik.http.routers.content-service.middlewares: content-service-strip-prefix,rate-limit-global@file
      traefik.http.middlewares.content-service-strip-prefix.stripprefix.prefixes: /api/content
      traefik.http.middlewares.content-service-strip-prefix.stripprefix.forceslash: false
      traefik.http.services.content-service.loadbalancer.server.port: "3000"
      traefik.http.services.content-service.loadbalancer.healthcheck.path: /healthz
      traefik.http.services.content-service.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.content-service.loadbalancer.healthcheck.timeout: 2s
      traefik.http.routers.content-service.entrypoints: websecure
      traefik.http.routers.content-service.tls: true
    depends_on:
      content-mongodb:
        condition: service_healthy
      content-redis:
        condition: service_healthy
      content-hdfs-namenode:
        condition: service_healthy
      content-hdfs-datanode:
        condition: service_healthy
    networks:
      - api-gateway
      - content-internal

  content-mongodb:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SRV_CONTENT_MONGO_ROOT_USERNAME?}
      MONGO_INITDB_ROOT_PASSWORD: ${SRV_CONTENT_MONGO_ROOT_PASSWORD?}
      MONGO_INITDB_DATABASE: ${SRV_CONTENT_MONGO_DATABASE?}
      SRV_CONTENT_MONGO_USERNAME: ${SRV_CONTENT_MONGO_USERNAME?}
      SRV_CONTENT_MONGO_PASSWORD: ${SRV_CONTENT_MONGO_PASSWORD?}
    healthcheck:
      # healthcheck uses username and password value from content-mongodb environment variables defined above
      test:
        [
          "CMD-SHELL",
          "mongosh --norc --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 })'",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - content-mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - content-internal

  content-hdfs-namenode:
    image: apache/hadoop:3.4
    hostname: content-hdfs-namenode
    command: ["hdfs", "namenode"]
    environment:
      - CLUSTER_NAME=${SRV_CONTENT_HDFS_CLUSTER_NAME?}
      - CORE-SITE.XML_fs.defaultFS=hdfs://content-hdfs-namenode:8020
      - HDFS-SITE.XML_dfs.replication=${SRV_CONTENT_HDFS_REPLICATION?}
      - HDFS-SITE.XML_dfs.permissions.enabled=${SRV_CONTENT_HDFS_PERMISSIONS_ENABLED?}
      - HDFS-SITE.XML_dfs.namenode.name.dir=file:///data/dfs/name
      - ENSURE_NAMENODE_DIR=/data/dfs/name
    volumes:
      - content-hdfs-namenode-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9870/jmx?qry=Hadoop:service=NameNode,name=NameNodeStatus' | grep -E '\"State\"\\s*:\\s*\"(active|standby)\"'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - content-internal

  content-hdfs-datanode:
    image: apache/hadoop:3.4
    hostname: content-hdfs-datanode
    command: ["hdfs", "datanode"]
    environment:
      - CLUSTER_NAME=${SRV_CONTENT_HDFS_CLUSTER_NAME?}
      - CORE-SITE.XML_fs.defaultFS=hdfs://content-hdfs-namenode:8020
      - HDFS-SITE.XML_dfs.replication=${SRV_CONTENT_HDFS_REPLICATION?}
      - HDFS-SITE.XML_dfs.permissions.enabled=${SRV_CONTENT_HDFS_PERMISSIONS_ENABLED?}
      - HDFS-SITE.XML_dfs.datanode.data.dir=file:///data/dfs/data
    volumes:
      - content-hdfs-datanode-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9864/jmx?qry=Hadoop:service=DataNode,name=DataNodeInfo' >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      content-hdfs-namenode:
        condition: service_healthy
    networks:
      - content-internal

  content-redis:
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "allkeys-lfu",
      ]
    volumes:
      - content-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - content-internal

networks:
  api-gateway:
    name: spotlite-api-gateway
  content-internal:

volumes:
  content-mongo-data:
  content-hdfs-namenode-data:
  content-hdfs-datanode-data:
  content-redis-data:
