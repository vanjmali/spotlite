services:
  rating-service:
    build:
      context: .
      additional_contexts:
        common-lib: ../common-lib
      dockerfile: ../Dockerfile.microservice
    environment:
      APP_PORT: 3000
      DB_HOST: rating-mongodb
      DB_PORT: 27017
      DB_USER: ${SRV_RATING_MONGO_USERNAME?}
      DB_PASS: ${SRV_RATING_MONGO_PASSWORD?}
      DB_NAME: ${SRV_RATING_MONGO_DATABASE?}
    labels:
      traefik.enable: true
      traefik.docker.network: spotlite-api-gateway
      traefik.http.routers.rating-service.rule: PathPrefix(`/api/rating`)
      traefik.http.services.content-service.loadbalancer.server.scheme: https
      traefik.http.routers.rating-service.middlewares: rating-service-strip-prefix,rate-limit-global@file
      traefik.http.middlewares.rating-service-strip-prefix.stripprefix.prefixes: /api/rating
      traefik.http.middlewares.rating-service-strip-prefix.stripprefix.forceslash: false
      traefik.http.services.rating-service.loadbalancer.server.port: "3000"
      traefik.http.services.content-service.loadbalancer.healthcheck.path: /healthz
      traefik.http.services.content-service.loadbalancer.healthcheck.interval: 5s
      traefik.http.services.content-service.loadbalancer.healthcheck.timeout: 2s
      traefik.http.routers.content-service.entrypoints: websecure
      traefik.http.routers.content-service.tls: true
    depends_on:
      rating-mongodb:
        condition: service_healthy
    networks:
      - api-gateway
      - rating-internal

  rating-mongodb:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SRV_RATING_MONGO_ROOT_USERNAME?}
      MONGO_INITDB_ROOT_PASSWORD: ${SRV_RATING_MONGO_ROOT_PASSWORD?}
      MONGO_INITDB_DATABASE: ${SRV_RATING_MONGO_DATABASE?}
      SRV_RATING_MONGO_USERNAME: ${SRV_RATING_MONGO_USERNAME?}
      SRV_RATING_MONGO_PASSWORD: ${SRV_RATING_MONGO_PASSWORD?}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --norc --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 })'",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - rating-mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - rating-internal

networks:
  api-gateway:
    name: spotlite-api-gateway
  rating-internal:

volumes:
  rating-mongo-data:
