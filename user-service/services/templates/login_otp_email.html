<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
			{{.Styles}}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="content">
				<h2 class="content__heading">Your Login Code</h2>
				<p class="content__text">
					Use this code to complete your login. This code will expire in 5
					minutes.
				</p>
				<div class="otp-container">
					<p class="otp-code">{{.OTP}}</p>
					<p class="otp-warning">Do not share this code with anyone.</p>
				</div>
				<p class="content__text">
					If you did not request this code, you can safely ignore this email.
				</p>
			</div>
			<div class="footer">
				<p class="footer__text">
					&copy; {{.FooterYear}} Spotlite | Demo for university course project.
					See
					<a
						class="footer__link"
						href="{{.RepoURL}}"
						target="_blank"
						rel="noopener noreferrer"
						>GitHub</a
					>
				</p>
			</div>
		</div>
	</body>
</html>
