apiVersion: v1
kind: Service
metadata:
  name: content-service
spec:
  selector:
    app: content-service
  ports:
    - name: https
      port: 3000
      targetPort: 3000
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-service
  template:
    metadata:
      labels:
        app: content-service
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z content-mongodb 27017; do echo "waiting for content-mongodb"; sleep 2; done
              until nc -z content-redis 6379; do echo "waiting for content-redis"; sleep 2; done
              until nc -z content-hdfs-namenode 8020; do echo "waiting for content-hdfs-namenode"; sleep 2; done
              until nc -z nats 4222; do echo "waiting for nats"; sleep 2; done
      containers:
        - name: content-service
          image: ghcr.io/vanjmali/spotlite:content-service
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: https
            - containerPort: 50051
              name: grpc
          env:
            - name: APP_PORT
              value: "3000"
            - name: REDIS_ADDR
              value: content-redis:6379
            - name: DB_HOST
              value: content-mongodb
            - name: DB_PORT
              value: "27017"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_CONTENT_MONGO_USERNAME
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_CONTENT_MONGO_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_CONTENT_MONGO_DATABASE
            - name: HDFS_URI
              value: content-hdfs-namenode:8020
            - name: HDFS_AUDIO_BASE
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_CONTENT_HDFS_AUDIO_BASE
            - name: HDFS_USER
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_CONTENT_HDFS_USER
            - name: HDFS_DATA_TRANSFER_PROTECTION
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_CONTENT_HDFS_DATA_TRANSFER_PROTECTION
            - name: GRPC_PORT
              value: "50051"
            - name: RATING_GRPC_ADDRESS
              value: rating-service:50051
            - name: SONG_RATING_CACHE_TTL_SECONDS
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SONG_RATING_CACHE_TTL_SECONDS
            - name: NATS_URL
              value: tls://nats:4222
            - name: ROOT_CERT_PATH
              value: /certs/rootCA.crt
            - name: CERT_PATH
              value: /certs/content-service.crt
            - name: KEY_PATH
              value: /certs/content-service.key
            - name: JWT_PRIVATE_KEY_PATH
              value: /run/keys/private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /run/keys/public.pem
            - name: LOG_DIR
              value: /tmp/logs
            - name: LOG_ROTATE_MAX_SIZE_MB
              value: "10"
            - name: LOG_ROTATE_MAX_BACKUPS
              value: "5"
            - name: LOG_ROTATE_MAX_AGE_DAYS
              value: "30"
            - name: LOG_ROTATE_COMPRESS
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
              scheme: HTTPS
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: crypto
              mountPath: /certs
              readOnly: true
            - name: jwt-keys
              mountPath: /run/keys
              readOnly: true
      volumes:
        - name: crypto
          secret:
            secretName: spotlite-crypto
            items:
              - key: rootCA.crt
                path: rootCA.crt
              - key: content-service.crt
                path: content-service.crt
              - key: content-service.key
                path: content-service.key
        - name: jwt-keys
          secret:
            secretName: spotlite-crypto
            items:
              - key: private.pem
                path: private.pem
              - key: public.pem
                path: public.pem
