apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - name: https
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z notification-cassandra 9042; do echo "waiting for notification-cassandra"; sleep 3; done
              until nc -z notification-redis 6379; do echo "waiting for notification-redis"; sleep 2; done
              until nc -z nats 4222; do echo "waiting for nats"; sleep 2; done
      containers:
        - name: notification-service
          image: ghcr.io/vanjmali/spotlite:notification-service
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: https
          env:
            - name: APP_PORT
              value: "3000"
            - name: REDIS_ADDR
              value: notification-redis:6379
            - name: CASSANDRA_HOST
              value: notification-cassandra
            - name: CASSANDRA_PORT
              value: "9042"
            - name: CASSANDRA_DC
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: CASSANDRA_DC
            - name: CASSANDRA_KEYSPACE
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: CASSANDRA_KEYSPACE
            - name: NATS_URL
              value: tls://nats:4222
            - name: ROOT_CERT_PATH
              value: /certs/rootCA.crt
            - name: CERT_PATH
              value: /certs/notification-service.crt
            - name: KEY_PATH
              value: /certs/notification-service.key
            - name: JWT_PUBLIC_KEY_PATH
              value: /run/keys/public.pem
            - name: LOG_DIR
              value: /app/logs
            - name: LOG_ROTATE_MAX_SIZE_MB
              value: "10"
            - name: LOG_ROTATE_MAX_BACKUPS
              value: "5"
            - name: LOG_ROTATE_MAX_AGE_DAYS
              value: "30"
            - name: LOG_ROTATE_COMPRESS
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
              scheme: HTTPS
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: crypto
              mountPath: /certs
              readOnly: true
            - name: jwt-key
              mountPath: /run/keys
              readOnly: true
      volumes:
        - name: crypto
          secret:
            secretName: spotlite-crypto
            items:
              - key: rootCA.crt
                path: rootCA.crt
              - key: notification-service.crt
                path: notification-service.crt
              - key: notification-service.key
                path: notification-service.key
        - name: jwt-key
          secret:
            secretName: spotlite-crypto
            items:
              - key: public.pem
                path: public.pem
