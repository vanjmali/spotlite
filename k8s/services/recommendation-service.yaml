apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
spec:
  selector:
    app: recommendation-service
  ports:
    - name: https
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z recommendation-neo4j 7687; do echo "waiting for recommendation-neo4j"; sleep 2; done
              until nc -z nats 4222; do echo "waiting for nats"; sleep 2; done
      containers:
        - name: recommendation-service
          image: ghcr.io/vanjmali/spotlite:recommendation-service
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: https
          env:
            - name: APP_PORT
              value: "3000"
            - name: NEO4J_URI
              value: bolt://recommendation-neo4j:7687
            - name: NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: NEO4J_USER
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: NEO4J_PASSWORD
            - name: NATS_URL
              value: tls://nats:4222
            - name: ROOT_CERT_PATH
              value: /certs/rootCA.crt
            - name: CERT_PATH
              value: /certs/recommendation-service.crt
            - name: KEY_PATH
              value: /certs/recommendation-service.key
            - name: JWT_PUBLIC_KEY_PATH
              value: /run/keys/public.pem
            - name: LOG_DIR
              value: /tmp/logs
            - name: LOG_ROTATE_MAX_SIZE_MB
              value: "10"
            - name: LOG_ROTATE_MAX_BACKUPS
              value: "5"
            - name: LOG_ROTATE_MAX_AGE_DAYS
              value: "30"
            - name: LOG_ROTATE_COMPRESS
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
              scheme: HTTPS
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: crypto
              mountPath: /certs
              readOnly: true
            - name: jwt-key
              mountPath: /run/keys
              readOnly: true
      volumes:
        - name: crypto
          secret:
            secretName: spotlite-crypto
            items:
              - key: rootCA.crt
                path: rootCA.crt
              - key: recommendation-service.crt
                path: recommendation-service.crt
              - key: recommendation-service.key
                path: recommendation-service.key
        - name: jwt-key
          secret:
            secretName: spotlite-crypto
            items:
              - key: public.pem
                path: public.pem
