apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
    - name: https
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z user-mongodb 27017; do echo "waiting for user-mongodb"; sleep 2; done
              until nc -z user-redis 6379; do echo "waiting for user-redis"; sleep 2; done
              until nc -z nats 4222; do echo "waiting for nats"; sleep 2; done
      containers:
        - name: user-service
          image: ghcr.io/vanjmali/spotlite:user-service
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: https
          env:
            - name: APP_PORT
              value: "3000"
            - name: REDIS_ADDR
              value: user-redis:6379
            - name: DB_HOST
              value: user-mongodb
            - name: DB_PORT
              value: "27017"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_USER_MONGO_USERNAME
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_USER_MONGO_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_USER_MONGO_DATABASE
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SMTP_PASS
            - name: MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: MAIL_FROM
            - name: SRV_USER_VERIFY_URL
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_USER_VERIFY_URL
            - name: SRV_USER_PASSWORD_RESET_URL
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_USER_PASSWORD_RESET_URL
            - name: APP_LOGIN_OTP_TTL_MINUTES
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: APP_LOGIN_OTP_TTL_MINUTES
            - name: APP_REFRESH_COOKIE_NAME
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: APP_REFRESH_COOKIE_NAME
            - name: APP_REFRESH_COOKIE_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: APP_REFRESH_COOKIE_DOMAIN
            - name: APP_REFRESH_COOKIE_SECURE
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: APP_REFRESH_COOKIE_SECURE
            - name: APP_REFRESH_COOKIE_SAMESITE
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: APP_REFRESH_COOKIE_SAMESITE
            - name: ROOT_CERT_PATH
              value: /certs/rootCA.crt
            - name: CERT_PATH
              value: /certs/user-service.crt
            - name: KEY_PATH
              value: /certs/user-service.key
            - name: JWT_PRIVATE_KEY_PATH
              value: /run/keys/private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /run/keys/public.pem
            - name: LOG_DIR
              value: /tmp/logs
            - name: LOG_ROTATE_MAX_SIZE_MB
              value: "10"
            - name: LOG_ROTATE_MAX_BACKUPS
              value: "5"
            - name: LOG_ROTATE_MAX_AGE_DAYS
              value: "30"
            - name: LOG_ROTATE_COMPRESS
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
              scheme: HTTPS
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          volumeMounts:
            - name: crypto
              mountPath: /certs
              readOnly: true
            - name: jwt-keys
              mountPath: /run/keys
              readOnly: true
      volumes:
        - name: crypto
          secret:
            secretName: spotlite-crypto
            items:
              - key: rootCA.crt
                path: rootCA.crt
              - key: user-service.crt
                path: user-service.crt
              - key: user-service.key
                path: user-service.key
        - name: jwt-keys
          secret:
            secretName: spotlite-crypto
            items:
              - key: private.pem
                path: private.pem
              - key: public.pem
                path: public.pem
