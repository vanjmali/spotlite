apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: backend-https-transport
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: user-service-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /api/users
    forceSlash: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: content-service-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /api/content
    forceSlash: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: notification-service-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /api/notifications
    forceSlash: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: subscription-service-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /api/subscriptions
    forceSlash: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rating-service-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /api/ratings
    forceSlash: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: recommendation-service-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /api/recommendations
    forceSlash: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spotlite
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: PathPrefix(`/api/users`)
      priority: 100
      middlewares:
        - name: user-service-strip-prefix
      services:
        - name: user-service
          port: 3000
          scheme: https
          serversTransport: backend-https-transport
    - kind: Rule
      match: PathPrefix(`/api/content`)
      priority: 99
      middlewares:
        - name: content-service-strip-prefix
      services:
        - name: content-service
          port: 3000
          scheme: https
          serversTransport: backend-https-transport
    - kind: Rule
      match: PathPrefix(`/api/notifications`)
      priority: 98
      middlewares:
        - name: notification-service-strip-prefix
      services:
        - name: notification-service
          port: 3000
          scheme: https
          serversTransport: backend-https-transport
    - kind: Rule
      match: PathPrefix(`/api/subscriptions`)
      priority: 97
      middlewares:
        - name: subscription-service-strip-prefix
      services:
        - name: subscription-service
          port: 3000
          scheme: https
          serversTransport: backend-https-transport
    - kind: Rule
      match: PathPrefix(`/api/ratings`)
      priority: 96
      middlewares:
        - name: rating-service-strip-prefix
      services:
        - name: rating-service
          port: 3000
          scheme: https
          serversTransport: backend-https-transport
    - kind: Rule
      match: PathPrefix(`/api/recommendations`)
      priority: 95
      middlewares:
        - name: recommendation-service-strip-prefix
      services:
        - name: recommendation-service
          port: 3000
          scheme: https
          serversTransport: backend-https-transport
    - kind: Rule
      match: PathPrefix(`/`)
      priority: 1
      services:
        - name: frontend
          port: 8080
