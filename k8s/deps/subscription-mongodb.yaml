apiVersion: v1
kind: ConfigMap
metadata:
  name: subscription-mongodb-init
data:
  mongo-init.js: |
    db = db.getSiblingDB(process.env.MONGO_INITDB_DATABASE);
    db.createUser({
      user: process.env.SRV_SUB_MONGO_USERNAME,
      pwd: process.env.SRV_SUB_MONGO_PASSWORD,
      roles: [{ role: "readWrite", db: db.getName() }]
    });
---
apiVersion: v1
kind: Service
metadata:
  name: subscription-mongodb
spec:
  clusterIP: None
  selector:
    app: subscription-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: subscription-mongodb
spec:
  serviceName: subscription-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: subscription-mongodb
  template:
    metadata:
      labels:
        app: subscription-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.2
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_SUB_MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_SUB_MONGO_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_SUB_MONGO_DATABASE
            - name: SRV_SUB_MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_SUB_MONGO_USERNAME
            - name: SRV_SUB_MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spotlite-app-secrets
                  key: SRV_SUB_MONGO_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  mongosh --quiet --username "$MONGO_INITDB_ROOT_USERNAME"
                  --password "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval 'db.runCommand({ ping: 1 })'
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  mongosh --quiet --username "$MONGO_INITDB_ROOT_USERNAME"
                  --password "$MONGO_INITDB_ROOT_PASSWORD"
                  --authenticationDatabase admin
                  --eval 'db.runCommand({ ping: 1 })'
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: mongo-init
              mountPath: /docker-entrypoint-initdb.d/mongo-init.js
              subPath: mongo-init.js
              readOnly: true
      volumes:
        - name: mongo-init
          configMap:
            name: subscription-mongodb-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
