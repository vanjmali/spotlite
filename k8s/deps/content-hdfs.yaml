apiVersion: v1
kind: Service
metadata:
  name: content-hdfs-namenode
spec:
  clusterIP: None
  selector:
    app: content-hdfs-namenode
  ports:
    - name: rpc
      port: 8020
      targetPort: 8020
    - name: web
      port: 9870
      targetPort: 9870
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: content-hdfs-namenode
spec:
  serviceName: content-hdfs-namenode
  replicas: 1
  selector:
    matchLabels:
      app: content-hdfs-namenode
  template:
    metadata:
      labels:
        app: content-hdfs-namenode
    spec:
      containers:
        - name: namenode
          image: apache/hadoop:3.4
          command: ["hdfs", "namenode"]
          env:
            - name: CLUSTER_NAME
              value: spotlite-hdfs
            - name: CORE-SITE.XML_fs.defaultFS
              value: hdfs://content-hdfs-namenode:8020
            - name: HDFS-SITE.XML_dfs.replication
              value: "1"
            - name: HDFS-SITE.XML_dfs.permissions.enabled
              value: "false"
            - name: HDFS-SITE.XML_dfs.namenode.name.dir
              value: file:///data/dfs/name
            - name: ENSURE_NAMENODE_DIR
              value: /data/dfs/name
          ports:
            - containerPort: 8020
              name: rpc
            - containerPort: 9870
              name: web
          readinessProbe:
            tcpSocket:
              port: 8020
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8020
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: content-hdfs-datanode
spec:
  clusterIP: None
  selector:
    app: content-hdfs-datanode
  ports:
    - name: data
      port: 9864
      targetPort: 9864
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: content-hdfs-datanode
spec:
  serviceName: content-hdfs-datanode
  replicas: 1
  selector:
    matchLabels:
      app: content-hdfs-datanode
  template:
    metadata:
      labels:
        app: content-hdfs-datanode
    spec:
      initContainers:
        - name: wait-for-namenode
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z content-hdfs-namenode 8020; do echo "waiting for content-hdfs-namenode"; sleep 3; done
      containers:
        - name: datanode
          image: apache/hadoop:3.4
          command: ["hdfs", "datanode"]
          env:
            - name: CLUSTER_NAME
              value: spotlite-hdfs
            - name: CORE-SITE.XML_fs.defaultFS
              value: hdfs://content-hdfs-namenode:8020
            - name: HDFS-SITE.XML_dfs.replication
              value: "1"
            - name: HDFS-SITE.XML_dfs.permissions.enabled
              value: "false"
            - name: HDFS-SITE.XML_dfs.datanode.data.dir
              value: file:///data/dfs/data
          ports:
            - containerPort: 9864
              name: data
          readinessProbe:
            tcpSocket:
              port: 9864
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 9864
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
