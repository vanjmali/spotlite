entryPoints:
  web:
    # Plain HTTP for local development
    address: ":80"
    http:

  websecure:
    # HTTPS entrypoint; will serve self-signed cert if none provided.
    address: ":443"
    http:
      # turns on TLS and uses default global settings
      tls: {}

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
  docker:
    exposedByDefault: false
    network: spotlite-api-gateway

api:
  dashboard: true
  insecure: true

tracing:
  otlp:
    http:
      endpoint: http://otel-collector:4318/v1/traces

# allows self signed certificates
serversTransport:
  insecureSkipVerify: true
