entryPoints:
  web:
    # Plain HTTP for local development
    address: ":80"
  websecure:
    # HTTPS entrypoint; will serve self-signed cert if none provided.
    address: ":443"
    http:
      tls: true

providers:
  docker:
    exposedByDefault: false
    network: spotlite-api-gateway

api:
  dashboard: true
  insecure: true

tracing:
  otlp:
    http:
      endpoint: http://otel-collector:4318/v1/traces
